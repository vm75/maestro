allowed_ips:
- 127.0.0.1
global:
  router_ip: 127.0.0.1
  https_port: 18443
  http_port: 18080
site_defaults:
  access_policy: public
listener_profiles:
  private:
    https:
    - address: 127.0.0.2
      port: 19443
access_policies:
  trusted:
    allow:
    - 192.0.2.0/24
    - 2001:db8::/32
http_access:
  mode: renewal_only
  listener_profile: legacy
  window_seconds: 3600
  externally_managed_wan: true
