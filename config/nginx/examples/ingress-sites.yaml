sites:
  app.example.test:
    kind: domain
    domain: app.example.test
    server_name: app.example.test
    upstream: http://127.0.0.1:19000
    enabled: false
    listener_profile: private
    access_policy: trusted
    disable_root: false
    enable_subfolders: false
    routes:
    - path: /admin
      match: exact
      access_policy: deny
    - path: /admin/
      match: prefix
      access_policy: deny
