name: Build Toolchain Image

# Deliberately manual-only: rebuild the Entware toolchain container image on demand.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  toolchain:
    name: Build Entware AArch64 Toolchain Image
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Free disk space for Entware buildroot
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push toolchain container image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/entware-aarch64-builder:latest"
          echo "Building $IMAGE using $(nproc) jobs..."
          docker build \
            --build-arg JOBS=$(nproc) \
            -t "$IMAGE" \
            -f tools/nginx-builder/Dockerfile .
          echo "Pushing $IMAGE to GHCR..."
          docker push "$IMAGE"
          echo "Successfully published $IMAGE"
