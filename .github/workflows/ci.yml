name: CI

# Main updates and opt-in branches run automatically; other PRs are manual.
on:
  push:
    branches:
      - main
      - 'ci/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open PR targeting main (0 checks the selected branch)"
        required: false
        type: number
        default: 0
      auto_fix:
        description: "Automatically fix Rust code on the selected ci/** branch"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    name: Select revision
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.select.outputs.ref }}
    steps:
      - name: Resolve checkout reference
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ref="$EVENT_SHA"
          if [[ "$RUN_EVENT" == "workflow_dispatch" && -n "$PR_NUMBER" && "$PR_NUMBER" != 0 ]]; then
            if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "Provide a valid PR number." >&2
              exit 1
            fi

            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            base=$(jq -r '.base.ref' <<<"$pr")
            state=$(jq -r '.state' <<<"$pr")
            if [[ "$base" != "main" || "$state" != "open" ]]; then
              echo "PR #$PR_NUMBER must be open and target main." >&2
              exit 1
            fi

            # Test the proposed merge result, including changes from main.
            ref=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/pull/$PR_NUMBER/merge" --jq '.sha')
            echo "Checking proposed merge of PR #$PR_NUMBER into main"
          fi

          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid checkout SHA." >&2; exit 1; }

          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

  autofix:
    name: Fix Rust formatting and safe Clippy suggestions
    needs: source
    # Never write to main, tags, fork PRs or proposed-merge checkouts.
    if: ${{ startsWith(github.ref, 'refs/heads/ci/') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == 0 && inputs.auto_fix)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - name: Check out branch revision without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false

      - name: Install baseline Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Apply machine-applicable Clippy fixes
        # The strict CI job reports any remaining warnings or compilation errors.
        continue-on-error: true
        run: cargo +1.85.0 clippy --fix --all-targets --locked

      - name: Format Rust sources
        run: cargo +1.85.0 fmt --all

      - name: Commit corrections and dispatch strict CI on the new head
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ needs.source.outputs.ref }}
        run: |
          set -euo pipefail
          [[ "$BRANCH" == ci/* && "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          if git diff --quiet HEAD --; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only commit modifications to existing tracked Rust sources.
          # Refuse unexpected changes rather than publishing build side effects.
          while IFS= read -r -d '' path; do
            if [[ "$path" != *.rs || ! -f "$path" || -L "$path" ]]; then
              echo "::error::Unexpected auto-fix change: $path"
              exit 1
            fi
            git add -- "$path"
          done < <(git diff --name-only --no-renames -z HEAD --)
          git diff --cached --check

          gh auth setup-git --hostname github.com
          remote_sha=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [[ "$remote_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Branch advanced; run CI on its latest revision."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: apply Rust formatting and Clippy fixes'
          # A normal, non-force push also protects against concurrent updates.
          git push origin "HEAD:refs/heads/$BRANCH"

          # GITHUB_TOKEN pushes do not trigger push workflows. Dispatch explicitly
          # so required checks attach to the corrected commit, not the old SHA.
          # Disable auto-fix for that run to avoid loops and repeated edits.
          gh workflow run ci.yml --ref "$BRANCH" -f pr_number=0 -f auto_fix=false
          echo 'changed=true' >> "$GITHUB_OUTPUT"

  full:
    name: Full CI (Rust 1.85)
    needs: [source, autofix]
    if: ${{ !cancelled() && needs.source.result == 'success' && (needs.autofix.result == 'skipped' || (needs.autofix.result == 'success' && needs.autofix.outputs.changed == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false

      - name: Install baseline Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Check formatting
        run: cargo +1.85.0 fmt --all -- --check

      - name: Verify build-free UI composition and JavaScript
        run: node scripts/test-web-ui.mjs

      - name: Set up supported nginx for integration tests
        uses: ./.github/actions/setup-nginx

      - name: Run tests
        run: cargo +1.85.0 test --locked

      - name: Validate Linux development bootstrap with mocked tools
        run: python3 -m unittest discover -s tests -p 'test_linux_dev.py' -v

      - name: Validate AArch64 lab scripts with mocked QEMU
        run: bash tests/test_lab_aarch64.sh

      - name: Run Clippy
        run: cargo +1.85.0 clippy --all-targets --locked -- -D warnings

      - name: Verify Entware IPK structure
        run: bash scripts/test-package-ipk.sh

      - name: Test automatic release policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_auto_release.py' -v

      - name: Build release binary
        run: cargo +1.85.0 build --release --locked

  linux-ui:
    name: Linux UI parity
    needs: [source, autofix]
    if: ${{ !cancelled() && needs.source.result == 'success' && (needs.autofix.result == 'skipped' || (needs.autofix.result == 'success' && needs.autofix.outputs.changed == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: linux-web/package-lock.json

      - name: Check and build Linux frontend
        run: |
          npm --prefix linux-web ci
          npm --prefix linux-web run check
          npm --prefix linux-web run build

      - name: Test Linux shared-module browser workflows
        run: |
          browser=$(command -v google-chrome || command -v chromium)
          node scripts/test-linux-ui.mjs "$browser"

  linux-native:
    name: Native Linux integration
    needs: [source, autofix]
    if: ${{ !cancelled() && needs.source.result == 'success' && (needs.autofix.result == 'skipped' || (needs.autofix.result == 'success' && needs.autofix.outputs.changed == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: linux-web/package-lock.json

      - name: Build Linux UI assets
        run: |
          npm --prefix linux-web ci
          npm --prefix linux-web run build

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Set up supported nginx for native Linux tests
        uses: ./.github/actions/setup-nginx

      - name: Install isolated Python requirements
        run: |
          python3 -m venv "$RUNNER_TEMP/maestro-python"
          "$RUNNER_TEMP/maestro-python/bin/python" -m pip install -r requirements.txt

      - name: Test and build Linux UI binary
        run: |
          cargo +stable test --locked --no-default-features --features linux-ui
          cargo +stable build --locked --no-default-features --features linux-ui

      - name: Native unprivileged Linux integration
        env:
          MAESTRO_LINUX_SMOKE_BIN: ${{ github.workspace }}/target/debug/maestro
        run: |
          PYTHON="$RUNNER_TEMP/maestro-python/bin/python" bash scripts/test-linux-integration.sh

  stable:
    name: Stable compatibility
    needs: [source, autofix]
    if: ${{ !cancelled() && needs.source.result == 'success' && (needs.autofix.result == 'skipped' || (needs.autofix.result == 'success' && needs.autofix.outputs.changed == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Check all targets on stable Rust
        run: cargo +stable check --locked --all-targets

  tag:
    name: Tag new stable version
    needs: [source, full, stable, linux-ui, linux-native]
    # Main intentionally skips autofix. Override the implicit success() gate
    # and explicitly require every validation job to have succeeded.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.source.result == 'success' && needs.full.result == 'success' &&
          needs.stable.result == 'success' && needs.linux-ui.result == 'success' &&
          needs.linux-native.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: automatic-release-tag
      cancel-in-progress: false
    steps:
      - name: Check out tested commit and release tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether this version needs a tag
        id: plan
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.ref }}
        run: python3 scripts/auto-release.py plan

      - name: Check release App configuration
        if: steps.plan.outputs.needed == 'true'
        env:
          APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Configure RELEASE_APP_CLIENT_ID (Actions variable) and RELEASE_APP_PRIVATE_KEY (Actions secret); see docs/releases.md."
            exit 1
          fi

      - name: Create repository-scoped release token
        if: steps.plan.outputs.needed == 'true'
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push annotated release tag to start the Release workflow
        if: steps.plan.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          EXPECTED_SHA: ${{ needs.source.outputs.ref }}
        run: |
          gh auth setup-git --hostname github.com
          python3 scripts/auto-release.py tag
