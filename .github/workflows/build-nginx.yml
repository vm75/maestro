name: Build Nginx

# Deliberately manual-only: no push, pull_request, tag, or schedule triggers.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "NGINX version selection"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - mainline
          - exact
      version:
        description: "X.Y.Z (required only when channel is exact)"
        required: false
        type: string
      publish_release:
        description: "Also publish an independent NGINX GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  nginx:
    name: Cross-build NGINX for Entware AArch64
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write # Required only by the optional GitHub Release step.
    env:
      NGINX_OUTPUT: ${{ github.workspace }}/dist/nginx
    steps:
      - name: Check out selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Free disk space for Entware toolchain
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          # Not needed by the native x86_64 cross-builder; runners are disposable.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Cross-build NGINX and matching IPKs
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            stable|mainline)
              if [[ -n "$VERSION" ]]; then
                echo "::error::Leave version blank for stable/mainline, or select exact."
                exit 1
              fi
              args=(--channel "$CHANNEL")
              ;;
            exact)
              if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
                echo "::error::Exact channel requires a version such as 1.30.6."
                exit 1
              fi
              args=(--version "$VERSION")
              ;;
            *)
              echo "::error::Unknown NGINX channel: $CHANNEL"
              exit 1
              ;;
          esac
          mkdir -p "$NGINX_OUTPUT"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/entware-aarch64-builder:latest"

          if docker pull "$IMAGE" 2>/dev/null; then
            echo "Pre-built Entware toolchain image found ($IMAGE)."
            echo "Running fast NGINX build in container..."
            docker run --rm \
              --user builder \
              -v "$GITHUB_WORKSPACE:/workspace" \
              -w /workspace \
              "$IMAGE" \
              bash tools/nginx-builder/build-nginx-entware-aarch64-reverse-proxy.sh \
                "${args[@]}" \
                --jobs "$(nproc)" \
                --no-update \
                --workdir /opt/nginx-entware \
                --output /workspace/dist/nginx
          else
            echo "Pre-built toolchain image $IMAGE not found."
            echo "Building toolchain and NGINX on host using $(nproc) jobs..."
            bash tools/nginx-builder/build-nginx-entware-aarch64-reverse-proxy.sh \
              "${args[@]}" \
              --jobs "$(nproc)" \
              --workdir "$RUNNER_TEMP/nginx-entware" \
              --output "$NGINX_OUTPUT"
          fi

      - name: Verify deliverables
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          [[ -s "$NGINX_OUTPUT/build-info.txt" ]]
          version=$(sed -n 's/^nginx_version=//p' "$NGINX_OUTPUT/build-info.txt")
          [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]] || {
            echo "::error::Missing or invalid built NGINX version"
            exit 1
          }
          (
            cd "$NGINX_OUTPUT"
            sha256sum -c SHA256SUMS
            shopt -s nullglob
            for name in nginx-ssl nginx-mod-brotli nginx-mod-stream nginx-mod-headers-more; do
              packages=("${name}_${version}-"*.ipk)
              if (( ${#packages[@]} != 1 )); then
                echo "::error::Expected one matching $name IPK for NGINX $version"
                exit 1
              fi
            done
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload a distinct artifact for this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nginx-${{ steps.verify.outputs.version }}-aarch64-k3.10-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: dist/nginx/
          if-no-files-found: error
          retention-days: 90

      - name: Publish independent NGINX release (never Latest)
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NGINX_VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail
          tag="nginx-v${NGINX_VERSION}-run${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          notes="$RUNNER_TEMP/nginx-release-notes.md"
          cat > "$notes" <<EOF
          Manually cross-built **NGINX ${NGINX_VERSION}** for Asuswrt-Merlin / Entware `aarch64-k3.10`.

          - Packages: nginx-ssl, nginx-mod-brotli, nginx-mod-stream, nginx-mod-headers-more
          - Build details, SHA-256 checksums, executable and matching modules are attached.
          - Built from [workflow run ${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).
          - Not installed or runtime-tested on a router; back up and validate before installing.
          EOF
          shopt -s nullglob
          assets=(dist/nginx/*.ipk dist/nginx/SHA256SUMS dist/nginx/build-info.txt
                  dist/nginx/nginx dist/nginx/*.so)
          (( ${#assets[@]} == 11 )) || {
            echo "::error::Expected 4 IPKs, checksum, build info, executable and 4 modules (11 assets)."
            exit 1
          }
          gh release create "$tag" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "NGINX ${NGINX_VERSION} (Entware AArch64, run ${GITHUB_RUN_ID})" \
            --notes-file "$notes" \
            --latest=false
